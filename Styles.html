<style>
  :root {
    --ink: #14213d;
    --paper: #fff8ea;
    --paper-strong: #f6e1b9;
    --deck: #2f4858;
    --deck-dark: #203744;
    --teal: #20746b;
    --teal-dark: #145a54;
    --gold: #f4b942;
    --red: #b94435;
    --green: #2f7d4f;
    --line: #d2b98a;
    --white: #ffffff;
    --shadow: 0 12px 30px rgba(20, 33, 61, 0.16);
    --radius: 8px;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    min-height: 100%;
    margin: 0;
  }

  body {
    color: var(--ink);
    background:
      linear-gradient(90deg, rgba(47, 72, 88, 0.08) 1px, transparent 1px),
      linear-gradient(0deg, rgba(47, 72, 88, 0.08) 1px, transparent 1px),
      var(--paper);
    background-size: 34px 34px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 18px;
  }

  button,
  input {
    font: inherit;
  }

  button {
    cursor: pointer;
  }

  .app-shell {
    width: min(100%, 980px);
    min-height: 100vh;
    margin: 0 auto;
    padding: 28px clamp(16px, 4vw, 36px);
  }

  .screen {
    min-height: calc(100vh - 56px);
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .loading-view,
  .center-panel {
    min-height: calc(100vh - 56px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
  }

  .brand-mark {
    width: 82px;
    height: 82px;
    display: grid;
    place-items: center;
    border: 4px solid var(--deck);
    border-radius: 50%;
    color: var(--paper);
    background: var(--red);
    font-weight: 800;
    letter-spacing: 2px;
    box-shadow: var(--shadow);
  }

  h1,
  h2,
  h3,
  p {
    margin: 0;
  }

  h1 {
    font-size: clamp(2rem, 4vw, 3.4rem);
    line-height: 1.05;
  }

  h2 {
    font-size: clamp(1.7rem, 3.4vw, 2.6rem);
    line-height: 1.1;
  }

  h3 {
    font-size: 1.25rem;
  }

  .subtitle {
    max-width: 680px;
    font-size: 1.12rem;
    line-height: 1.45;
    overflow-wrap: anywhere;
  }

  .panel {
    width: 100%;
    border: 2px solid var(--line);
    border-radius: var(--radius);
    background: rgba(255, 255, 255, 0.88);
    box-shadow: var(--shadow);
    padding: clamp(18px, 3vw, 28px);
  }

  .story-panel {
    position: relative;
    overflow: hidden;
    border-color: var(--deck);
  }

  .story-panel:before {
    content: "";
    position: absolute;
    inset: 0 0 auto;
    height: 10px;
    background: repeating-linear-gradient(90deg, var(--deck), var(--deck) 28px, var(--gold) 28px, var(--gold) 42px);
  }

  .name-form {
    display: grid;
    gap: 12px;
    width: min(100%, 520px);
    margin: 0 auto;
    text-align: left;
  }

  .name-form label {
    font-weight: 700;
  }

  .name-form input {
    width: 100%;
    min-height: 58px;
    border: 2px solid var(--deck);
    border-radius: var(--radius);
    padding: 12px 14px;
    background: var(--white);
    color: var(--ink);
    font-size: 1.15rem;
  }

  .button-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }

  .primary-button,
  .secondary-button,
  .small-button,
  .danger-button {
    min-height: 52px;
    border: 2px solid transparent;
    border-radius: var(--radius);
    padding: 12px 18px;
    font-weight: 800;
  }

  .primary-button {
    color: var(--white);
    background: var(--teal);
    border-color: var(--teal-dark);
  }

  .secondary-button {
    color: var(--ink);
    background: var(--paper-strong);
    border-color: var(--line);
  }

  .danger-button {
    color: var(--white);
    background: var(--red);
    border-color: #8f3027;
  }

  .small-button {
    min-height: 42px;
    padding: 8px 12px;
    color: var(--ink);
    background: transparent;
    border-color: var(--line);
    font-size: 0.95rem;
  }

  .error-text {
    min-height: 24px;
    color: var(--red);
    font-weight: 700;
  }

  .top-bar {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: center;
  }

  .progress-strip {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .progress-card {
    border: 2px solid var(--line);
    border-radius: var(--radius);
    background: var(--white);
    padding: 12px;
  }

  .progress-card strong {
    display: block;
    font-size: 1.4rem;
  }

  .bar {
    height: 12px;
    overflow: hidden;
    border-radius: 999px;
    background: #e8dcc8;
    margin-top: 8px;
  }

  .bar span {
    display: block;
    height: 100%;
    width: 0;
    background: var(--teal);
  }

  .question-card {
    display: grid;
    gap: 18px;
    border-color: var(--deck);
  }

  .round-intro {
    color: var(--deck-dark);
    font-weight: 700;
  }

  .prompt {
    font-size: clamp(1.5rem, 3vw, 2.25rem);
    line-height: 1.18;
    font-weight: 800;
    overflow-wrap: anywhere;
  }

  .selection-hint {
    margin-top: 10px;
    color: var(--deck-dark);
    font-weight: 700;
    line-height: 1.35;
  }

  .option-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .answer-option {
    min-height: 76px;
    border: 3px solid var(--deck);
    border-radius: var(--radius);
    padding: 14px;
    color: var(--ink);
    background: var(--white);
    font-weight: 800;
    line-height: 1.2;
    overflow-wrap: anywhere;
    text-align: center;
  }

  .answer-option:hover,
  .answer-option:focus {
    outline: 3px solid rgba(244, 185, 66, 0.55);
  }

  .answer-option.selected {
    color: var(--white);
    background: var(--deck);
    border-color: var(--gold);
  }

  .answer-option.correct {
    color: var(--white);
    background: var(--green);
    border-color: #245f3c;
  }

  .answer-option.incorrect {
    color: var(--white);
    background: var(--red);
    border-color: #8f3027;
  }

  .answer-option.missed-correct {
    color: var(--ink);
    background: #fff4d6;
    border-color: var(--gold);
  }

  .answer-status {
    display: block;
    margin-top: 8px;
    font-size: 0.82rem;
    font-weight: 800;
  }

  .feedback {
    border-left: 8px solid var(--gold);
    border-radius: var(--radius);
    background: #fff4d6;
    padding: 14px;
    font-weight: 700;
  }

  .feedback.correct {
    border-left-color: var(--green);
    background: #e5f3e9;
  }

  .feedback.incorrect {
    border-left-color: var(--red);
    background: #fbe5df;
  }

  .review-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .review-item {
    border: 2px solid var(--line);
    border-radius: var(--radius);
    background: var(--white);
    padding: 14px;
  }

  .review-item h3 {
    margin-bottom: 10px;
    color: var(--teal-dark);
  }

  .review-line {
    margin: 6px 0;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }

  .review-line strong {
    color: var(--deck);
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 18px;
    background: rgba(20, 33, 61, 0.56);
    z-index: 20;
  }

  .modal {
    width: min(100%, 920px);
    max-height: min(86vh, 760px);
    overflow: auto;
    border-radius: var(--radius);
    background: var(--paper);
    padding: 20px;
  }

  .hidden {
    display: none !important;
  }

  .sync-status {
    min-height: 24px;
    color: var(--deck-dark);
    font-size: 0.95rem;
    text-align: center;
  }

  .footer-actions {
    display: flex;
    justify-content: center;
    padding-bottom: 14px;
  }

  @media (max-width: 900px) {
    .app-shell {
      padding: 18px 12px;
    }

    .top-bar,
    .progress-strip,
    .option-grid,
    .review-grid {
      grid-template-columns: 1fr;
    }

    .button-row {
      flex-direction: column;
    }

    .primary-button,
    .secondary-button,
    .danger-button {
      width: 100%;
    }
  }
</style>
