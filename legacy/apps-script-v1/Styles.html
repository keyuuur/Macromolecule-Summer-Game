<style>
  :root {
    --navy-950: #061421;
    --navy-900: #082033;
    --navy-800: #0b2d44;
    --navy-700: #103a56;
    --parchment-50: #fff8e8;
    --parchment-100: #f7ebcf;
    --parchment-200: #ead7aa;
    --parchment-300: #d7bd81;
    --gold-500: #d9a441;
    --gold-600: #b98222;
    --gold-700: #7c5518;
    --green-500: #1f7a43;
    --green-600: #146b3a;
    --green-700: #0e4e2c;
    --red-500: #b84236;
    --red-100: #f8ded9;
    --blue-500: #2267c7;
    --purple-500: #7047b8;
    --orange-500: #d88a1d;
    --ink: #07182a;
    --muted-ink: #405367;
    --white: #ffffff;
    --success-bg: #e4f3e8;
    --success-border: #2f8a48;
    --needed-bg: #fff2c7;
    --needed-border: #d39a25;
    --error-bg: #f9ded8;
    --error-border: #b84236;
    --carbs: #2f8a48;
    --lipids: #d89a25;
    --proteins: #7047b8;
    --nucleic: #2c74c9;
    --font-display: Georgia, "Times New Roman", serif;
    --font-body: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --text-xs: 0.78rem;
    --text-sm: 0.9rem;
    --text-md: 1rem;
    --text-lg: 1.18rem;
    --text-xl: 1.48rem;
    --text-2xl: 2rem;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-8: 32px;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 8px;
    --shadow-card: 0 16px 34px rgba(2, 12, 22, 0.22);
    --shadow-soft: 0 8px 18px rgba(4, 18, 30, 0.18);
    --shadow-button: 0 3px 0 rgba(0, 0, 0, 0.25);
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    min-height: 100%;
    margin: 0;
  }

  body {
    color: var(--ink);
    background:
      linear-gradient(90deg, rgba(217, 164, 65, 0.08) 1px, transparent 1px),
      linear-gradient(0deg, rgba(217, 164, 65, 0.06) 1px, transparent 1px),
      linear-gradient(135deg, var(--navy-950), var(--navy-900) 50%, var(--navy-800));
    background-size: 42px 42px, 42px 42px, auto;
    font-family: var(--font-body);
    font-size: 17px;
  }

  button,
  input {
    font: inherit;
  }

  button {
    cursor: pointer;
  }

  button:disabled {
    cursor: not-allowed;
  }

  h1,
  h2,
  h3,
  p {
    margin: 0;
  }

  h1,
  h2,
  h3 {
    color: var(--ink);
    font-family: var(--font-display);
    line-height: 1.08;
  }

  h1 {
    font-size: clamp(1.9rem, 4vw, 3rem);
  }

  h2 {
    font-size: clamp(1.55rem, 3vw, 2.25rem);
  }

  h3 {
    font-size: var(--text-lg);
  }

  :focus-visible {
    outline: 3px solid rgba(217, 164, 65, 0.9);
    outline-offset: 3px;
  }

  .app-shell {
    width: min(100%, 1180px);
    min-height: 100dvh;
    margin: 0 auto;
    padding: clamp(10px, 2vw, 18px);
  }

  .screen {
    min-height: calc(100dvh - 24px);
    display: grid;
    grid-template-rows: auto 1fr;
    gap: var(--space-4);
  }

  .loading-view,
  .center-panel {
    min-height: calc(100dvh - 24px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-4);
    text-align: center;
  }

  .loading-view {
    color: var(--parchment-50);
  }

  .loading-view h1,
  .loading-view p {
    color: var(--parchment-50);
  }

  .brand-mark {
    width: 74px;
    height: 74px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    border: 3px solid var(--gold-500);
    border-radius: 50%;
    color: var(--parchment-50);
    background:
      linear-gradient(135deg, var(--red-500), #7b2b25 70%),
      var(--red-500);
    box-shadow: inset 0 0 0 4px rgba(255, 248, 232, 0.16), var(--shadow-soft);
    font-family: var(--font-display);
    font-size: 1.45rem;
    font-weight: 900;
    letter-spacing: 0.08em;
  }

  .quest-header {
    display: grid;
    grid-template-columns: minmax(240px, 1.3fr) minmax(165px, 0.8fr) minmax(170px, 0.9fr) minmax(190px, 0.85fr);
    gap: var(--space-4);
    align-items: stretch;
    padding: var(--space-4);
    border: 1px solid rgba(217, 164, 65, 0.42);
    border-radius: var(--radius-md);
    background: rgba(6, 20, 33, 0.92);
    box-shadow: var(--shadow-card);
  }

  .quest-header.compact-header {
    grid-template-columns: minmax(240px, 1fr) minmax(170px, 0.55fr) minmax(170px, 0.55fr) minmax(170px, 0.55fr);
  }

  .quest-brand {
    display: flex;
    gap: var(--space-3);
    align-items: center;
    min-width: 0;
  }

  .quest-title {
    display: grid;
    gap: var(--space-1);
    min-width: 0;
  }

  .quest-title h1 {
    color: var(--parchment-50);
    font-size: clamp(1.25rem, 2vw, 1.72rem);
  }

  .quest-title p,
  .dashboard-label,
  .dashboard-note {
    color: rgba(255, 248, 232, 0.78);
  }

  .dashboard-module {
    display: grid;
    align-content: center;
    gap: var(--space-3);
    min-width: 0;
    padding: var(--space-3) var(--space-4);
    border: 1px solid rgba(217, 164, 65, 0.3);
    border-radius: var(--radius-md);
    background: rgba(11, 45, 68, 0.86);
  }

  .dashboard-module.toolkit-module {
    align-content: start;
  }

  .dashboard-label,
  .eyebrow,
  .task-label {
    color: var(--gold-700);
    font-size: var(--text-xs);
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .dashboard-module .dashboard-label,
  .dashboard-module .eyebrow {
    color: var(--gold-500);
  }

  .dashboard-value {
    color: var(--parchment-50);
    font-size: 1.45rem;
    font-weight: 900;
    line-height: 1;
  }

  .dashboard-note {
    font-size: var(--text-xs);
    line-height: 1.3;
  }

  .round-nodes {
    display: flex;
    gap: var(--space-1);
  }

  .round-node {
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255, 248, 232, 0.42);
    border-radius: 50%;
    color: rgba(255, 248, 232, 0.78);
    font-size: 0.72rem;
    font-weight: 900;
  }

  .round-node.complete {
    color: var(--navy-950);
    background: var(--gold-500);
    border-color: var(--gold-500);
  }

  .round-node.active {
    color: var(--white);
    background: var(--green-500);
    border-color: var(--green-500);
  }

  .screen-stage {
    display: grid;
    align-items: start;
    gap: var(--space-6);
  }

  .panel {
    width: 100%;
    border: 2px solid var(--gold-600);
    border-radius: var(--radius-md);
    background:
      linear-gradient(90deg, rgba(124, 85, 24, 0.04) 1px, transparent 1px),
      linear-gradient(0deg, rgba(124, 85, 24, 0.04) 1px, transparent 1px),
      var(--parchment-50);
    background-size: 26px 26px, 26px 26px, auto;
    box-shadow: var(--shadow-card);
    padding: clamp(20px, 4vw, 32px);
  }

  .story-panel {
    max-width: 840px;
    display: grid;
    gap: var(--space-3);
    position: relative;
    overflow: hidden;
    border-color: var(--gold-500);
    text-align: center;
  }

  .story-panel h1 {
    justify-self: center;
    width: fit-content;
    max-width: 100%;
    border: 2px solid var(--gold-500);
    padding: 2px 8px 4px;
    background: rgba(255, 248, 232, 0.68);
  }

  .story-panel:before,
  .panel-header:before {
    content: "";
    position: absolute;
    inset: 0 0 auto;
    height: 12px;
    background: repeating-linear-gradient(90deg, var(--navy-800), var(--navy-800) 28px, var(--gold-500) 28px, var(--gold-500) 42px);
  }

  .panel-header {
    position: relative;
    display: grid;
    gap: var(--space-2);
    margin: calc(-1 * clamp(16px, 3vw, 28px)) calc(-1 * clamp(16px, 3vw, 28px)) var(--space-5);
    padding: var(--space-6) clamp(16px, 3vw, 28px) var(--space-5);
    border-bottom: 1px solid rgba(124, 85, 24, 0.18);
    background: rgba(247, 235, 207, 0.82);
  }

  .subtitle {
    max-width: 760px;
    color: var(--muted-ink);
    font-size: var(--text-md);
    line-height: 1.48;
    overflow-wrap: anywhere;
  }

  .center-panel > .subtitle {
    color: var(--parchment-50);
  }

  .quest-summary,
  .landing-rules {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--space-4);
    width: min(100%, 840px);
  }

  .summary-chip,
  .status-chip,
  .molecule-chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    min-height: 36px;
    padding: var(--space-2) var(--space-3);
    border: 1px solid rgba(185, 130, 34, 0.45);
    border-radius: 999px;
    background: rgba(255, 248, 232, 0.78);
    color: var(--ink);
    font-size: var(--text-sm);
    font-weight: 800;
    text-align: center;
  }

  .summary-chip {
    min-height: 58px;
    border-radius: var(--radius-md);
    background: var(--parchment-100);
  }

  .molecule-chip[data-molecule="Carbohydrates"] {
    color: var(--white);
    background: var(--carbs);
    border-color: var(--carbs);
  }

  .molecule-chip[data-molecule="Lipids"] {
    color: var(--ink);
    background: var(--needed-bg);
    border-color: var(--lipids);
  }

  .molecule-chip[data-molecule="Proteins"] {
    color: var(--white);
    background: var(--proteins);
    border-color: var(--proteins);
  }

  .molecule-chip[data-molecule="Nucleic Acids"] {
    color: var(--white);
    background: var(--nucleic);
    border-color: var(--nucleic);
  }

  .name-form {
    display: grid;
    gap: var(--space-3);
    width: min(100%, 560px);
    margin: 0 auto;
    text-align: left;
  }

  .name-form label {
    font-weight: 900;
  }

  .name-form input {
    width: 100%;
    min-height: 56px;
    border: 2px solid var(--navy-800);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    background: var(--white);
    color: var(--ink);
    font-size: var(--text-lg);
  }

  .button-row,
  .toolkit-actions,
  .top-bar {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-3);
    align-items: center;
  }

  .button-row {
    justify-content: center;
    margin-top: var(--space-5);
  }

  .top-bar {
    justify-content: space-between;
  }

  .primary-button,
  .secondary-button,
  .small-button,
  .danger-button {
    min-height: 48px;
    border: 2px solid transparent;
    border-radius: var(--radius-md);
    padding: 11px 18px;
    font-weight: 900;
    line-height: 1.1;
    text-align: center;
    box-shadow: var(--shadow-button);
    transition: transform 120ms ease, filter 120ms ease, box-shadow 120ms ease;
  }

  .primary-button {
    color: var(--white);
    background: linear-gradient(#23874a, var(--green-600));
    border-color: var(--green-700);
  }

  .secondary-button {
    color: var(--ink);
    background: linear-gradient(var(--parchment-50), var(--parchment-200));
    border-color: var(--gold-600);
  }

  .danger-button {
    color: var(--white);
    background: linear-gradient(#c94f41, var(--red-500));
    border-color: #8f3027;
  }

  .small-button {
    min-height: 40px;
    padding: 8px 12px;
    color: var(--parchment-50);
    background: rgba(255, 248, 232, 0.08);
    border-color: rgba(217, 164, 65, 0.52);
    box-shadow: none;
    font-size: var(--text-sm);
  }

  .primary-button:not(:disabled):hover,
  .secondary-button:not(:disabled):hover,
  .small-button:not(:disabled):hover,
  .danger-button:not(:disabled):hover {
    filter: brightness(1.05);
    transform: translateY(-1px);
  }

  .primary-button:disabled,
  .secondary-button:disabled,
  .small-button:disabled,
  .danger-button:disabled {
    opacity: 0.58;
    filter: grayscale(0.25);
    box-shadow: none;
  }

  .error-text {
    min-height: 24px;
    color: var(--red-500);
    font-weight: 900;
    line-height: 1.35;
  }

  .progress-strip {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--space-3);
  }

  .progress-card {
    border: 1px solid rgba(185, 130, 34, 0.42);
    border-radius: var(--radius-md);
    background: rgba(255, 248, 232, 0.72);
    padding: var(--space-3);
  }

  .progress-card strong {
    display: block;
    color: var(--ink);
    font-size: 1.35rem;
  }

  .bar {
    height: 12px;
    overflow: hidden;
    border: 1px solid rgba(124, 85, 24, 0.28);
    border-radius: 999px;
    background: rgba(6, 20, 33, 0.22);
  }

  .bar span {
    display: block;
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--gold-500), var(--green-500));
  }

  .gameplay-screen .screen-stage {
    min-height: 0;
  }

  .question-card {
    display: grid;
    gap: var(--space-4);
    border-color: var(--gold-500);
  }

  .question-card > .primary-button,
  .question-card > .button-row {
    position: sticky;
    bottom: var(--space-3);
    z-index: 4;
  }

  .question-card > .primary-button {
    justify-self: center;
    min-width: min(100%, 260px);
  }

  .question-card > .button-row {
    padding: var(--space-2) 0 0;
    background: linear-gradient(rgba(255, 248, 232, 0), var(--parchment-50) 40%);
  }

  .question-meta {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
    align-items: center;
    justify-content: space-between;
  }

  .question-copy {
    display: grid;
    gap: var(--space-3);
  }

  .round-intro {
    color: var(--muted-ink);
    font-weight: 800;
    line-height: 1.35;
  }

  .prompt {
    color: var(--ink);
    font-family: var(--font-display);
    font-size: clamp(1.45rem, 3vw, 2.25rem);
    font-weight: 900;
    line-height: 1.15;
    overflow-wrap: anywhere;
  }

  .selection-hint {
    color: var(--navy-800);
    font-weight: 900;
    line-height: 1.35;
  }

  .option-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--space-4);
  }

  .answer-option {
    min-height: 76px;
    display: grid;
    grid-template-columns: 40px minmax(0, 1fr);
    gap: var(--space-3);
    align-items: center;
    border: 2px solid rgba(8, 32, 51, 0.28);
    border-radius: var(--radius-md);
    padding: var(--space-4);
    color: var(--ink);
    background: linear-gradient(var(--white), var(--parchment-50));
    font-weight: 900;
    line-height: 1.18;
    overflow-wrap: anywhere;
    text-align: left;
    box-shadow: 0 3px 0 rgba(7, 24, 42, 0.12);
  }

  .answer-option:before {
    content: "?";
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border: 2px solid rgba(7, 24, 42, 0.18);
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, var(--parchment-200), var(--gold-500));
    color: var(--white);
    font-size: var(--text-sm);
    font-weight: 900;
  }

  .answer-option[data-option="Carbohydrates"]:before {
    content: "C";
    background: var(--carbs);
  }

  .answer-option[data-option="Lipids"]:before {
    content: "L";
    background: var(--lipids);
  }

  .answer-option[data-option="Proteins"]:before {
    content: "P";
    background: var(--proteins);
  }

  .answer-option[data-option="Nucleic Acids"]:before {
    content: "N";
    background: var(--nucleic);
  }

  .answer-option:hover,
  .answer-option:focus-visible {
    border-color: var(--gold-500);
    box-shadow: 0 0 0 3px rgba(217, 164, 65, 0.24), 0 3px 0 rgba(7, 24, 42, 0.12);
  }

  .answer-option.selected {
    color: var(--ink);
    background: var(--success-bg);
    border-color: var(--success-border);
    box-shadow: 0 0 0 3px rgba(47, 138, 72, 0.16), 0 3px 0 rgba(7, 24, 42, 0.12);
  }

  .answer-option.correct {
    color: var(--ink);
    background: var(--success-bg);
    border-color: var(--success-border);
  }

  .answer-option.incorrect {
    color: var(--ink);
    background: var(--error-bg);
    border-color: var(--error-border);
  }

  .answer-option.missed-correct {
    color: var(--ink);
    background: var(--needed-bg);
    border-color: var(--needed-border);
  }

  .answer-option.correct:before {
    content: "OK";
    background: var(--success-border);
  }

  .answer-option.incorrect:before {
    content: "NO";
    background: var(--error-border);
  }

  .answer-option.missed-correct:before {
    content: "+";
    color: var(--ink);
    background: var(--needed-bg);
    border-color: var(--needed-border);
  }

  .answer-status {
    grid-column: 2;
    display: block;
    width: fit-content;
    margin-top: 8px;
    padding: 4px 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.62);
    font-size: var(--text-xs);
    font-weight: 900;
  }

  .feedback {
    border: 2px solid var(--needed-border);
    border-left-width: 8px;
    border-radius: var(--radius-md);
    background: var(--needed-bg);
    padding: var(--space-5);
    color: var(--ink);
    font-weight: 800;
    line-height: 1.45;
  }

  .feedback:focus {
    outline: 3px solid rgba(217, 164, 65, 0.85);
    outline-offset: 3px;
  }

  .feedback.correct {
    border-color: var(--success-border);
    border-left-color: var(--success-border);
    background: var(--success-bg);
  }

  .feedback.incorrect {
    border-color: var(--error-border);
    border-left-color: var(--error-border);
    background: var(--error-bg);
  }

  .review-panel {
    display: grid;
    gap: var(--space-4);
  }

  .review-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--space-3);
  }

  .review-item {
    display: grid;
    gap: var(--space-2);
    border: 2px solid rgba(185, 130, 34, 0.42);
    border-radius: var(--radius-md);
    background: rgba(255, 255, 255, 0.72);
    padding: var(--space-5);
  }

  .review-title {
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }

  .review-icon {
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    border-radius: var(--radius-sm);
    color: var(--white);
    background: var(--gold-500);
    font-size: var(--text-sm);
    font-weight: 900;
  }

  .review-item[data-molecule="Carbohydrates"] {
    border-color: rgba(47, 138, 72, 0.52);
  }

  .review-item[data-molecule="Carbohydrates"] .review-icon {
    background: var(--carbs);
  }

  .review-item[data-molecule="Lipids"] {
    border-color: rgba(216, 154, 37, 0.62);
  }

  .review-item[data-molecule="Lipids"] .review-icon {
    background: var(--lipids);
  }

  .review-item[data-molecule="Proteins"] {
    border-color: rgba(112, 71, 184, 0.58);
  }

  .review-item[data-molecule="Proteins"] .review-icon {
    background: var(--proteins);
  }

  .review-item[data-molecule="Nucleic Acids"] {
    border-color: rgba(44, 116, 201, 0.58);
  }

  .review-item[data-molecule="Nucleic Acids"] .review-icon {
    background: var(--nucleic);
  }

  .review-line {
    color: var(--muted-ink);
    font-size: var(--text-sm);
    line-height: 1.35;
    overflow-wrap: anywhere;
  }

  .review-line strong {
    color: var(--ink);
  }

  .sync-status {
    min-height: 22px;
    color: inherit;
    font-size: var(--text-sm);
    font-weight: 800;
    line-height: 1.35;
  }

  .toolkit-module .sync-status {
    color: rgba(255, 248, 232, 0.84);
  }

  .save-card,
  .round-card,
  .confirm-card {
    max-width: 780px;
    display: grid;
    gap: var(--space-4);
    text-align: center;
  }

  .save-status-card {
    border: 2px solid var(--gold-600);
    border-radius: var(--radius-md);
    background: rgba(247, 235, 207, 0.72);
