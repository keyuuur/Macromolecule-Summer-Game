<script>
  (function() {
    var STORAGE_KEY = 'piratePantryStateV1';
    var PENDING_SYNC_KEY = 'piratePantryPendingSyncV1';
    var app = document.getElementById('app');
    var appData = null;
    var state = null;
    var currentCard = null;
    var selectedOptions = [];
    var syncTimer = null;
    var syncInFlight = false;
    var queuedSyncPayload = null;
    var activeSyncPayload = null;

    function init() {
      google.script.run
        .withSuccessHandler(function(data) {
          appData = data;
          showStartingScreen();
        })
        .withFailureHandler(function(error) {
          showError('The game could not load yet. ' + getErrorMessage(error));
        })
        .getGameData();
    }

    function showStartingScreen() {
      var saved = loadSavedState();
      var pending = loadPendingSyncPayload();

      if (pending && pending.questionBankVersion === appData.config.questionBankVersion) {
        syncBestScore(pending);
      }

      if (saved && saved.questionBankVersion === appData.config.questionBankVersion) {
        state = saved;

        if (state.totalCorrect >= appData.config.targetCorrect) {
          if (hasUnsyncedProgress(state)) {
            state.syncStatus = 'Completed score found on this iPad. Saving to Mr. Patel\'s Sheet...';
            queueScoreSync(makeScorePayload('resume_completed', state), true);
            showFinalScreen();
            return;
          }

          showLanding();
          return;
        }

        showResumePrompt(state);
        return;
      }

      showLanding();
    }

    function showLanding() {
      currentCard = null;
      selectedOptions = [];
      render([
        '<section class="screen center-panel">',
        '  <div class="brand-mark" aria-hidden="true">PP</div>',
        '  <div class="panel story-panel">',
        '    <h1>' + escapeHtml(appData.config.gameTitle) + '</h1>',
        '    <p class="subtitle">Sort foods, functions, building blocks, and elements to prove you know the four macromolecules.</p>',
        '    <p class="subtitle">The pirate crew mixed up the science pantry. Your job is to put each clue back with the right macromolecule.</p>',
        '  </div>',
        '  <form id="nameForm" class="panel name-form">',
        '    <label for="studentName">First and Last Name</label>',
        '    <input id="studentName" name="studentName" autocomplete="name" maxlength="80" placeholder="Example: Maya Johnson">',
        '    <div id="nameError" class="error-text"></div>',
        '    <button class="primary-button" type="submit">Start</button>',
        '  </form>',
        '</section>'
      ].join(''));

      document.getElementById('nameForm').addEventListener('submit', function(event) {
        event.preventDefault();
        var name = normalizeName(document.getElementById('studentName').value);

        if (!isRecognizableName(name)) {
          document.getElementById('nameError').textContent = 'Enter first and last name, or first name plus last initial.';
          return;
        }

        startNewAttempt(name);
        showFirstGameStep();
      });
    }

    function showResumePrompt(saved) {
      render([
        '<section class="screen center-panel">',
        '  <div class="brand-mark" aria-hidden="true">PP</div>',
        '  <div class="panel">',
        '    <h1>Saved Game Found</h1>',
        '    <p class="subtitle">You have a saved game for ' + escapeHtml(saved.studentName) + '. Continue where you left off?</p>',
        '    <div class="button-row">',
        '      <button id="continueSaved" class="primary-button" type="button">Continue Saved Game</button>',
        '      <button id="startOver" class="secondary-button" type="button">Start Over</button>',
        '    </div>',
        '  </div>',
        '</section>'
      ].join(''));

      document.getElementById('continueSaved').addEventListener('click', function() {
        state = saved;
        scheduleSync('resume', true);
        showGameScreen();
      });

      document.getElementById('startOver').addEventListener('click', function() {
        showStartOverConfirm(saved.studentName);
      });
    }

    function showStartOverConfirm(name) {
      render([
        '<section class="screen center-panel">',
        '  <div class="panel">',
        '    <h1>Start Over?</h1>',
        '    <p class="subtitle">This clears saved progress on this iPad. Your best score already saved in Mr. Patel\'s Sheet will not be deleted.</p>',
        '    <div class="button-row">',
        '      <button id="yesStartOver" class="danger-button" type="button">Yes, Start Over</button>',
        '      <button id="cancelStartOver" class="secondary-button" type="button">Cancel</button>',
        '    </div>',
        '  </div>',
        '</section>'
      ].join(''));

      document.getElementById('yesStartOver').addEventListener('click', function() {
        clearSavedState();
        showLanding();
      });

      document.getElementById('cancelStartOver').addEventListener('click', function() {
        showResumePrompt(state || { studentName: name });
      });
    }

    function showReviewScreen() {
      if (!appData.config.allowReviewChart) {
        showGameScreen();
        return;
      }

      render([
        '<section class="screen">',
        '  <div class="top-bar">',
        '    <div>',
        '      <h1>Quick Review</h1>',
        '      <p class="subtitle">You can use this chart during the game. It does not lower your score.</p>',
        '    </div>',
        '  </div>',
        '  <div class="review-grid">' + renderReviewItems() + '</div>',
        '  <div class="button-row">',
        '    <button id="startGame" class="primary-button" type="button">Start Game</button>',
        '    <button id="skipReview" class="secondary-button" type="button">Skip Review</button>',
        '  </div>',
        '</section>'
      ].join(''));

      document.getElementById('startGame').addEventListener('click', showGameScreen);
      document.getElementById('skipReview').addEventListener('click', showGameScreen);
    }

    function showFirstGameStep() {
      if (appData.config.allowReviewChart) {
        showReviewScreen();
      } else {
        showGameScreen();
      }
    }

    function showGameScreen() {
      if (!state.currentQueue || state.currentQueue.length === 0) {
        startRoundQueue();
      }

      if (!state.currentCardId) {
        pickNextCard();
      }

      renderGameShell();
      renderCurrentCard();
    }

    function renderGameShell() {
      var round = getRoundInfo(state.currentRound);
      var reviewButton = appData.config.allowReviewChart ? '<button id="openReview" class="secondary-button" type="button">Review Chart</button>' : '';

      render([
        '<section class="screen">',
        '  <div class="top-bar">',
        '    <div>',
        '      <h1>' + escapeHtml(appData.config.gameTitle) + '</h1>',
        '      <p class="round-intro">' + escapeHtml(round.intro) + '</p>',
        '    </div>',
        '    ' + reviewButton,
        '  </div>',
        '  <div class="progress-strip">',
        '    <div class="progress-card">',
        '      <span>Correct Answers</span>',
        '      <strong>' + state.totalCorrect + ' / ' + appData.config.targetCorrect + '</strong>',
        '      <div class="bar"><span style="width:' + progressPercent(state.totalCorrect, appData.config.targetCorrect) + '%"></span></div>',
        '    </div>',
        '    <div class="progress-card">',
        '      <span>Round ' + state.currentRound + ': ' + escapeHtml(round.name) + '</span>',
        '      <strong>' + getRoundCorrect(state.currentRound) + ' / ' + appData.config.correctPerRound + '</strong>',
        '      <div class="bar"><span style="width:' + progressPercent(getRoundCorrect(state.currentRound), appData.config.correctPerRound) + '%"></span></div>',
        '    </div>',
        '  </div>',
        '  <section id="questionArea" class="panel question-card"></section>',
        '  <div id="syncStatus" class="sync-status">' + escapeHtml(state.syncStatus || 'Progress saves automatically.') + '</div>',
        '  <div class="footer-actions"><button id="resetLocal" class="small-button" type="button">Reset saved game</button></div>',
        '</section>'
      ].join(''));

      if (document.getElementById('openReview')) {
        document.getElementById('openReview').addEventListener('click', openReviewModal);
      }

      document.getElementById('resetLocal').addEventListener('click', function() {
        if (window.confirm('Clear saved progress on this iPad? This will not delete the best score in Mr. Patel\'s Sheet.')) {
          clearSavedState();
          showLanding();
        }
      });
    }

    function renderCurrentCard() {
      currentCard = findQuestionById(state.currentCardId);

      if (!currentCard) {
        pickNextCard();
        currentCard = findQuestionById(state.currentCardId);
      }

      if (!currentCard) {
        showError('No card is available for this round. Ask Mr. Patel to run setup or check the QuestionBank tab.');
        return;
      }

      selectedOptions = [];
      var area = document.getElementById('questionArea');
      var isMulti = currentCard.interaction_type === 'multi_select';

      area.innerHTML = [
        '<div>',
        '  <p class="round-intro">' + escapeHtml(currentCard.round_name) + '</p>',
        '  <h2 class="prompt">' + escapeHtml(currentCard.prompt) + '</h2>',
        isMulti ? '  <p id="selectionHint" class="selection-hint">Choose ' + currentCard.correct.length + ' answers. Selected: 0 of ' + currentCard.correct.length + '.</p>' : '',
        '</div>',
        '<div id="optionGrid" class="option-grid">' + renderOptions(currentCard, isMulti) + '</div>',
        isMulti ? '<button id="checkAnswer" class="primary-button" type="button" disabled>Check Answer</button>' : '',
        '<div id="feedback" class="feedback hidden"></div>',
        '<div class="button-row"><button id="nextCard" class="primary-button hidden" type="button">Continue</button></div>'
      ].join('');

      Array.prototype.slice.call(area.querySelectorAll('.answer-option')).forEach(function(button) {
        button.addEventListener('click', function() {
          handleOptionClick(button, isMulti);
        });
      });

      if (isMulti) {
        document.getElementById('checkAnswer').addEventListener('click', function() {
          evaluateAnswer();
        });
      }

      document.getElementById('nextCard').addEventListener('click', continueAfterFeedback);
      saveLocalState();
    }

    function renderOptions(card, isMulti) {
      return card.options.map(function(option, index) {
        var pressed = isMulti ? ' aria-pressed="false"' : '';
        return '<button class="answer-option" type="button" data-option="' + escapeHtml(option) + '"' + pressed + '>' + escapeHtml(option) + '</button>';
      }).join('');
    }

    function handleOptionClick(button, isMulti) {
      var option = button.getAttribute('data-option');

      if (document.getElementById('feedback') && !document.getElementById('feedback').classList.contains('hidden')) {
        return;
      }

      if (!isMulti) {
        selectedOptions = [option];
        button.classList.add('selected');
        evaluateAnswer();
        return;
      }

      if (selectedOptions.indexOf(option) === -1) {
        selectedOptions.push(option);
        button.classList.add('selected');
        button.setAttribute('aria-pressed', 'true');
      } else {
        selectedOptions = selectedOptions.filter(function(item) {
          return item !== option;
        });
        button.classList.remove('selected');
        button.setAttribute('aria-pressed', 'false');
      }

      updateSelectionHint();
      document.getElementById('checkAnswer').disabled = selectedOptions.length !== currentCard.correct.length;
    }

    function updateSelectionHint() {
      var hint = document.getElementById('selectionHint');

      if (hint && currentCard) {
        hint.textContent = 'Choose ' + currentCard.correct.length + ' answers. Selected: ' + selectedOptions.length + ' of ' + currentCard.correct.length + '.';
      }
    }

    function evaluateAnswer() {
      var isCorrect = isExactMatch(selectedOptions, currentCard.correct);
      var feedback = document.getElementById('feedback');
      var optionButtons = Array.prototype.slice.call(document.querySelectorAll('.answer-option'));

      optionButtons.forEach(function(button) {
        var option = button.getAttribute('data-option');
        var isCorrectOption = currentCard.correct.indexOf(option) !== -1;
        var wasSelected = selectedOptions.indexOf(option) !== -1;
        button.disabled = true;

        if (isCorrectOption && wasSelected) {
          button.classList.add('correct');
          button.innerHTML = escapeHtml(option) + '<span class="answer-status">Correct pick</span>';
          button.setAttribute('aria-label', option + ': correct pick');
        } else if (isCorrectOption) {
          button.classList.add('missed-correct');
          button.innerHTML = escapeHtml(option) + '<span class="answer-status">Needed</span>';
          button.setAttribute('aria-label', option + ': correct answer needed');
        } else if (wasSelected) {
          button.classList.add('incorrect');
          button.innerHTML = escapeHtml(option) + '<span class="answer-status">Not part of answer</span>';
          button.setAttribute('aria-label', option + ': not part of the answer');
        }
      });

      if (document.getElementById('checkAnswer')) {
        document.getElementById('checkAnswer').disabled = true;
      }

      if (isCorrect) {
        markCorrect();
        feedback.textContent = 'Correct. ' + currentCard.explanation;
        feedback.className = 'feedback correct';
      } else {
        markIncorrect();
        feedback.textContent = currentCard.interaction_type === 'multi_select'
          ? 'Not quite. You needed exactly ' + currentCard.correct.length + ' answers. ' + currentCard.explanation
          : 'Not quite. ' + currentCard.explanation;
        feedback.className = 'feedback incorrect';
      }

      feedback.classList.remove('hidden');
      document.getElementById('nextCard').classList.remove('hidden');
      saveLocalState();
    }

    function markCorrect() {
      if (state.answeredCorrectIds.indexOf(currentCard.card_id) === -1) {
        state.answeredCorrectIds.push(currentCard.card_id);
        state.totalCorrect += 1;
        state.roundCorrect[String(state.currentRound)] = getRoundCorrect(state.currentRound) + 1;
      }

      state.currentCardId = '';
      state.updatedAt = new Date().toISOString();
      scheduleSync('correct', false);
    }

    function markIncorrect() {
      if (state.missedIds.indexOf(currentCard.card_id) === -1) {
        state.missedIds.push(currentCard.card_id);
      }

      addCardBackLater(currentCard.card_id);
      state.currentCardId = '';
      state.updatedAt = new Date().toISOString();
    }

    function continueAfterFeedback() {
      if (state.totalCorrect >= appData.config.targetCorrect) {
        completeGame();
        return;
      }

      if (getRoundCorrect(state.currentRound) >= appData.config.correctPerRound) {
        completeRound();
        return;
      }

      pickNextCard();
      renderGameShell();
      renderCurrentCard();
    }

    function completeRound() {
      var round = getRoundInfo(state.currentRound);
      var nextRound = state.currentRound + 1;
      scheduleSync('round_complete', true);

      if (nextRound > 4) {
        completeGame();
        return;
      }

      render([
        '<section class="screen center-panel">',
        '  <div class="panel">',
        '    <h1>Round Complete</h1>',
        '    <p class="subtitle">You finished Round ' + state.currentRound + ': ' + escapeHtml(round.name) + '.</p>',
        '    <button id="nextRound" class="primary-button" type="button">Start Round ' + nextRound + '</button>',
        '  </div>',
        '</section>'
      ].join(''));

      document.getElementById('nextRound').addEventListener('click', function() {
        state.currentRound = nextRound;
        state.currentCardId = '';
        state.currentQueue = [];
        state.updatedAt = new Date().toISOString();
        startRoundQueue();
        saveLocalState();
        showGameScreen();
      });
    }

    function completeGame() {
      state.completedAt = state.completedAt || new Date().toISOString();
      state.currentCardId = '';
      state.updatedAt = new Date().toISOString();
      saveLocalState();
      scheduleSync('game_complete', true);
      showFinalScreen();
    }

    function showFinalScreen() {
      var scorePending = hasPendingSyncForState(state) || hasUnsyncedProgress(state);
      var scoreSaving = isSyncBusyForState(state);
      var buttons = [];

      if (appData.config.allowReplay) {
        buttons.push('<button id="playAgain" class="primary-button" type="button"' + (scorePending ? ' disabled' : '') + '>Play Again</button>');
      }

      if (scorePending) {
        buttons.push('<button id="retrySync" class="secondary-button" type="button"' + (scoreSaving ? ' disabled' : '') + '>Try Saving Again</button>');
      }

      if (appData.config.allowReviewChart) {
        buttons.push('<button id="reviewFinal" class="secondary-button" type="button">Review Chart</button>');
      }

      render([
        '<section class="screen center-panel">',
        '  <div class="brand-mark" aria-hidden="true">PP</div>',
        '  <div class="panel">',
        '    <h1>You reached ' + appData.config.targetCorrect + ' correct answers!</h1>',
        '    <p class="subtitle">Score from this attempt: ' + state.totalCorrect + ' / ' + appData.config.targetCorrect + '</p>',
        '    <p class="subtitle">Rounds completed: ' + getRoundsCompleted() + ' / 4</p>',
        '    <p id="syncStatus" class="sync-status">' + escapeHtml(state.syncStatus || 'Your score is saving automatically.') + '</p>',
        scorePending && appData.config.allowReplay ? '    <p id="playAgainNotice" class="sync-status">Play Again unlocks after this score reaches the Sheet.</p>' : '',
        '    <div class="button-row">',
        '      ' + buttons.join(''),
        '    </div>',
        '  </div>',
        '</section>'
      ].join(''));

      if (document.getElementById('playAgain')) {
        document.getElementById('playAgain').addEventListener('click', function() {
          if (hasPendingSyncForState(state) || hasUnsyncedProgress(state)) {
            state.syncStatus = 'Save this score first, then Play Again will unlock.';
            updateSyncStatus();
            return;
          }

          var name = state.studentName;
          startNewAttempt(name);
          showFirstGameStep();
        });
      }

      if (document.getElementById('retrySync')) {
        document.getElementById('retrySync').addEventListener('click', function() {
          queueScoreSync(makeScorePayload('manual_retry', state), true);
        });
      }

      if (document.getElementById('reviewFinal')) {
        document.getElementById('reviewFinal').addEventListener('click', openReviewModal);
      }
    }

    function startNewAttempt(name) {
      state = {
        studentName: normalizeName(name),
        studentKey: normalizeName(name).toLowerCase(),
        attemptId: makeAttemptId(),
        questionBankVersion: appData.config.questionBankVersion,
        targetCorrect: appData.config.targetCorrect,
        correctPerRound: appData.config.correctPerRound,
        currentRound: 1,
        totalCorrect: 0,
        roundCorrect: {
          1: 0,
          2: 0,
          3: 0,
          4: 0
        },
        answeredCorrectIds: [],
        missedIds: [],
        currentQueue: [],
        currentCardId: '',
        lastServerSyncedCorrect: 0,
        syncStatus: 'Progress saves automatically.',
        startedAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        completedAt: null
      };

      startRoundQueue();
      saveLocalState();
    }

    function startRoundQueue() {
      var cards = appData.questions.filter(function(card) {
        return card.round_id === state.currentRound && state.answeredCorrectIds.indexOf(card.card_id) === -1;
      });

      state.currentQueue = shuffle(cards.map(function(card) {
        return card.card_id;
      }));
    }

    function pickNextCard() {
      if (!state.currentQueue || state.currentQueue.length === 0) {
        startRoundQueue();
      }

      var nextId = state.currentQueue.shift();

      if (nextId === state.lastCardId && state.currentQueue.length > 0) {
        state.currentQueue.push(nextId);
        nextId = state.currentQueue.shift();
      }

      state.currentCardId = nextId || '';
      state.lastCardId = state.currentCardId;
      state.updatedAt = new Date().toISOString();
      saveLocalState();
    }

    function addCardBackLater(cardId) {
      var remaining = state.currentQueue || [];

      if (remaining.indexOf(cardId) === -1 && state.answeredCorrectIds.indexOf(cardId) === -1) {
        if (remaining.length > 1) {
          remaining.splice(Math.min(remaining.length, 2), 0, cardId);
        } else {
          remaining.push(cardId);
        }
      }

      state.currentQueue = remaining;
    }

    function scheduleSync(reason, immediate) {
      if (!state || !state.studentName) {
        return;
      }

      if (!immediate && state.totalCorrect <= state.lastServerSyncedCorrect) {
        return;
      }

      queueScoreSync(makeScorePayload(reason || 'progress', state), immediate);
    }

    function queueScoreSync(payload, immediate) {
      if (!payload) {
        return;
      }

      queuedSyncPayload = payload;
      savePendingSyncPayload(payload);

      if (syncTimer) {
        window.clearTimeout(syncTimer);
      }

      syncTimer = window.setTimeout(function() {
        var nextPayload = queuedSyncPayload;
        queuedSyncPayload = null;
        syncBestScore(nextPayload);
      }, immediate ? 50 : 900);
    }

    function syncBestScore(payload) {
      if (!payload) {
        return;
      }

      if (syncInFlight) {
        queuedSyncPayload = chooseHigherPayload(queuedSyncPayload, payload);
        savePendingSyncPayload(queuedSyncPayload);
        return;
      }

      syncInFlight = true;
      activeSyncPayload = payload;
      applySyncStatusToCurrentState(payload, 'Saving best score to Mr. Patel\'s Sheet...');
      updateSyncStatus();

      google.script.run
        .withSuccessHandler(function(response) {
          syncInFlight = false;
          activeSyncPayload = null;

          if (response && response.success) {
            markPayloadSynced(payload, response);
            applySyncStatusToCurrentState(payload, response.saved ? 'Best score saved to Mr. Patel\'s Sheet.' : 'Your best score in the Sheet is already the same or higher.');
          } else {
            applySyncStatusToCurrentState(payload, 'Saved on this iPad. Sheet sync needs another try.');
          }

          saveLocalState();
          updateSyncStatus();
          syncQueuedPayloadIfNeeded();
        })
        .withFailureHandler(function(error) {
          syncInFlight = false;
          activeSyncPayload = null;
          savePendingSyncPayload(payload);
          applySyncStatusToCurrentState(payload, 'Saved on this iPad. Sheet sync needs another try.');
          saveLocalState();
          updateSyncStatus();
          syncQueuedPayloadIfNeeded();
        })
        .saveBestScore(payload);
    }

    function updateSyncStatus() {
      var status = document.getElementById('syncStatus');

      if (status && state) {
        status.textContent = state.syncStatus || '';
      }

      updateFinalScreenControls();
    }

    function syncQueuedPayloadIfNeeded() {
      var nextPayload = queuedSyncPayload;
      queuedSyncPayload = null;

      if (nextPayload) {
        window.setTimeout(function() {
          syncBestScore(nextPayload);
        }, 300);
      }
    }

    function makeScorePayload(reason, sourceState) {
      var snapshot = sourceState || state;

      return {
        studentName: snapshot.studentName,
        attemptId: snapshot.attemptId,
        questionBankVersion: snapshot.questionBankVersion,
        totalCorrect: Number(snapshot.totalCorrect) || 0,
        targetCorrect: Number(snapshot.targetCorrect) || appData.config.targetCorrect,
        currentRound: Number(snapshot.currentRound) || 1,
        roundsCompleted: getRoundsCompletedForState(snapshot),
        roundCorrect: cloneRoundCorrect(snapshot.roundCorrect),
        answeredCorrectIds: (snapshot.answeredCorrectIds || []).slice(),
        answeredCorrectCount: (snapshot.answeredCorrectIds || []).length,
        missedCount: (snapshot.missedIds || []).length,
        completedAt: snapshot.completedAt,
        updatedAt: snapshot.updatedAt || new Date().toISOString(),
        reason: reason || 'progress'
      };
    }

    function chooseHigherPayload(currentPayload, newPayload) {
      if (!currentPayload) {
        return newPayload;
      }

      return Number(newPayload.totalCorrect || 0) >= Number(currentPayload.totalCorrect || 0) ? newPayload : currentPayload;
    }

    function applySyncStatusToCurrentState(payload, message) {
      if (state && payloadBelongsToState(payload, state)) {
        state.syncStatus = message;
      }
    }

    function markPayloadSynced(payload, response) {
      var bestCorrect = Number(response.bestCorrect || payload.totalCorrect || 0);

      if (state && payloadBelongsToState(payload, state)) {
        state.lastServerSyncedCorrect = Math.max(Number(state.lastServerSyncedCorrect || 0), bestCorrect);
      }

      clearPendingSyncPayloadIfCovered(payload, bestCorrect);
    }

    function payloadBelongsToState(payload, sourceState) {
      return payload
        && sourceState
        && payload.studentName === sourceState.studentName
        && payload.attemptId === sourceState.attemptId;
    }

    function hasUnsyncedProgress(sourceState) {
      if (!sourceState) {
        return false;
      }

      return Number(sourceState.totalCorrect || 0) > Number(sourceState.lastServerSyncedCorrect || 0);
    }

    function hasPendingSyncForState(sourceState) {
      var pending = loadPendingSyncPayload();

      return !!(pending && payloadBelongsToState(pending, sourceState));
    }

    function isSyncBusyForState(sourceState) {
      return payloadBelongsToState(activeSyncPayload, sourceState) || payloadBelongsToState(queuedSyncPayload, sourceState);
    }

    function savePendingSyncPayload(payload) {
      try {
        window.localStorage.setItem(PENDING_SYNC_KEY, JSON.stringify(payload));
      } catch (error) {
      }
    }

    function loadPendingSyncPayload() {
      try {
        var raw = window.localStorage.getItem(PENDING_SYNC_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (error) {
        return null;
      }
    }

    function clearPendingSyncPayloadIfCovered(payload, bestCorrect) {
      var pending = loadPendingSyncPayload();

      if (pending && payloadBelongsToState(pending, payload) && Number(pending.totalCorrect || 0) <= Number(bestCorrect || 0)) {
        try {
          window.localStorage.removeItem(PENDING_SYNC_KEY);
        } catch (error) {
        }
      }
    }

    function updateFinalScreenControls() {
      var playAgain = document.getElementById('playAgain');
      var retrySync = document.getElementById('retrySync');
      var notice = document.getElementById('playAgainNotice');
      var scorePending = state && (hasPendingSyncForState(state) || hasUnsyncedProgress(state));
      var scoreSaving = state && isSyncBusyForState(state);

      if (playAgain) {
        playAgain.disabled = !!scorePending;
      }

      if (retrySync) {
        retrySync.classList.toggle('hidden', !scorePending);
        retrySync.disabled = !!scoreSaving;
      }

      if (notice) {
        notice.textContent = scorePending ? (scoreSaving ? 'Saving now. Play Again unlocks after this score reaches the Sheet.' : 'Play Again unlocks after this score reaches the Sheet.') : '';
      }
    }

    function openReviewModal() {
      if (!appData.config.allowReviewChart) {
        return;
      }

      var modal = document.createElement('div');
      var previousFocus = document.activeElement;
      modal.className = 'modal-backdrop';
      modal.innerHTML = [
        '<section class="modal" role="dialog" aria-modal="true" aria-label="Review Chart">',
        '  <div class="top-bar">',
        '    <h2>Review Chart</h2>',
        '    <button id="closeReview" class="secondary-button" type="button">Close</button>',
        '  </div>',
        '  <p class="subtitle">Using this chart does not lower your score.</p>',
        '  <div class="review-grid">' + renderReviewItems() + '</div>',
        '</section>'
      ].join('');

      document.body.appendChild(modal);

      function closeModal() {
        document.removeEventListener('keydown', handleModalKeydown);
        document.body.removeChild(modal);
        if (previousFocus && previousFocus.focus) {
          previousFocus.focus();
        }
      }

      function handleModalKeydown(event) {
        if (event.key === 'Escape') {
          closeModal();
          return;
        }

        if (event.key === 'Tab') {
          trapFocus(modal, event);
        }
      }

      document.getElementById('closeReview').addEventListener('click', closeModal);
      modal.addEventListener('click', function(event) {
        if (event.target === modal) {
          closeModal();
        }
      });
      document.addEventListener('keydown', handleModalKeydown);
      document.getElementById('closeReview').focus();
    }

    function renderReviewItems() {
      return appData.reviewChart.map(function(item) {
        return [
          '<article class="review-item">',
          '  <h3>' + escapeHtml(item.macromolecule) + '</h3>',
          '  <p class="review-line"><strong>Elements:</strong> ' + escapeHtml(item.elements) + '</p>',
          '  <p class="review-line"><strong>Building Block:</strong> ' + escapeHtml(item.buildingBlock) + '</p>',
          '  <p class="review-line"><strong>Main Jobs:</strong> ' + escapeHtml(item.jobs) + '</p>',
          '  <p class="review-line"><strong>Examples:</strong> ' + escapeHtml(item.examples) + '</p>',
          '</article>'
        ].join('');
      }).join('');
    }

    function findQuestionById(cardId) {
      for (var i = 0; i < appData.questions.length; i++) {
        if (appData.questions[i].card_id === cardId) {
          return appData.questions[i];
        }
      }

      return null;
    }

    function getRoundInfo(roundId) {
      for (var i = 0; i < appData.rounds.length; i++) {
        if (appData.rounds[i].id === roundId) {
          return appData.rounds[i];
        }
      }

      return appData.rounds[0];
    }

    function getRoundCorrect(roundId) {
      return Number(state.roundCorrect[String(roundId)] || state.roundCorrect[roundId] || 0);
    }

    function getRoundsCompleted() {
      return getRoundsCompletedForState(state);
    }

    function getRoundsCompletedForState(sourceState) {
      var count = 0;

      [1, 2, 3, 4].forEach(function(roundId) {
        var roundCorrect = Number((sourceState.roundCorrect || {})[String(roundId)] || (sourceState.roundCorrect || {})[roundId] || 0);

        if (roundCorrect >= appData.config.correctPerRound) {
          count++;
        }
      });

      return count;
    }

    function cloneRoundCorrect(roundCorrect) {
      return {
        1: Number((roundCorrect || {})['1'] || (roundCorrect || {})[1] || 0),
        2: Number((roundCorrect || {})['2'] || (roundCorrect || {})[2] || 0),
        3: Number((roundCorrect || {})['3'] || (roundCorrect || {})[3] || 0),
        4: Number((roundCorrect || {})['4'] || (roundCorrect || {})[4] || 0)
      };
    }

    function isExactMatch(selected, correct) {
      if (selected.length !== correct.length) {
        return false;
      }

      var selectedSorted = selected.slice().sort();
      var correctSorted = correct.slice().sort();

      for (var i = 0; i < correctSorted.length; i++) {
        if (selectedSorted[i] !== correctSorted[i]) {
          return false;
        }
      }

      return true;
    }

    function saveLocalState() {
      if (!state) {
        return;
      }

      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (error) {
        state.syncStatus = 'This iPad is blocking local save. Your Sheet score can still save online.';
      }
    }

    function loadSavedState() {
      try {
        var raw = window.localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (error) {
        return null;
      }
    }

    function clearSavedState() {
      try {
        window.localStorage.removeItem(STORAGE_KEY);
      } catch (error) {
      }
    }

    function render(html) {
      app.innerHTML = html;
      moveFocusToScreenTitle();
    }

    function showError(message) {
      render([
        '<section class="screen center-panel">',
        '  <div class="panel">',
        '    <h1>Game Setup Needs Attention</h1>',
        '    <p class="subtitle">' + escapeHtml(message) + '</p>',
        '  </div>',
        '</section>'
      ].join(''));
    }

    function getErrorMessage(error) {
      if (!error) {
        return '';
      }

      return error.message || String(error);
    }

    function normalizeName(value) {
      return String(value || '').trim().replace(/\s+/g, ' ');
    }

    function isRecognizableName(value) {
      var name = normalizeName(value);
      return name.split(' ').length >= 2 && name.replace(/\s/g, '').length >= 3;
    }

    function moveFocusToScreenTitle() {
      window.setTimeout(function() {
        var heading = app.querySelector('h1, h2');

        if (heading) {
          heading.setAttribute('tabindex', '-1');
          heading.focus();
        }
      }, 0);
    }

    function trapFocus(container, event) {
      var focusable = Array.prototype.slice.call(container.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')).filter(function(element) {
        return !element.disabled && element.offsetParent !== null;
      });

      if (focusable.length === 0) {
        return;
      }

      var first = focusable[0];
      var last = focusable[focusable.length - 1];

      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

    function makeAttemptId() {
      return 'attempt_' + new Date().getTime() + '_' + Math.floor(Math.random() * 100000);
    }

    function shuffle(items) {
      var copy = items.slice();

      for (var i = copy.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = copy[i];
        copy[i] = copy[j];
        copy[j] = temp;
      }

      return copy;
    }

    function progressPercent(value, target) {
      return Math.max(0, Math.min(100, Math.round((Number(value) / Number(target)) * 100)));
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    init();
  })();
</script>
